{% extends "crud/form_base.html" %}

{% block page_header %}

{% set page_icon = "bi-diagram-3" %}
{% set page_title = "Modelo" %}
{% set page_description = "Cadastro de modelos do Catálogo Técnico." %}

{% include "components/page_header.html" %}

{% endblock %}


{% block form_fields %}

<div class="row">

    <div class="col-md-4 mb-3">

        <label class="form-label">

            Produto *

        </label>

        <select
            class="form-select"
            name="produto_id"
            required>

            <option value="">

                Selecione...

            </option>

            {% for produto in produtos %}

            <option
                value="{{ produto.id }}"
                {% if modelo and modelo.produto_id == produto.id %}
                    selected
                {% endif %}>

                {{ produto.nome }}

            </option>

            {% endfor %}

        </select>

    </div>

    <div class="col-md-3 mb-3">

        <label class="form-label">

            Código *

        </label>

        <input
            class="form-control"
            name="codigo"
            maxlength="30"
            required
            value="{{ modelo.codigo if modelo else '' }}">

    </div>

    <div class="col-md-5 mb-3">

        <label class="form-label">

            Nome *

        </label>

        <input
            class="form-control"
            name="nome"
            maxlength="100"
            required
            value="{{ modelo.nome if modelo else '' }}">

    </div>

</div>


<div class="row">

    <div class="col-md-3 mb-3">

        <label class="form-label">

            Versão

        </label>

        <input
            class="form-control"
            name="versao"
            maxlength="20"
            value="{{ modelo.versao if modelo else '' }}">

    </div>

    <div class="col-md-3 mb-3">

        <label class="form-label">

            Ordem

        </label>

        <input
            type="number"
            min="0"
            class="form-control"
            name="ordem"
            value="{{ modelo.ordem if modelo else 0 }}">

    </div>

    <div class="col-md-3 d-flex align-items-end mb-3">

        <div class="form-check">

            <input
                class="form-check-input"
                type="checkbox"
                name="padrao"
                value="1"
                {% if modelo and modelo.padrao %}
                    checked
                {% endif %}>

            <label class="form-check-label">

                Modelo padrão

            </label>

        </div>

    </div>

    <div class="col-md-3 d-flex align-items-end mb-3">

        <div class="form-check">

            <input
                class="form-check-input"
                type="checkbox"
                name="ativo"
                value="1"
                {% if modelo %}
                    {% if modelo.ativo %}
                        checked
                    {% endif %}
                {% else %}
                    checked
                {% endif %}>

            <label class="form-check-label">

                Ativo

            </label>

        </div>

    </div>

</div>


<div class="mb-3">

    <label class="form-label">

        Descrição

    </label>

    <textarea
        class="form-control"
        rows="4"
        name="descricao">{{ modelo.descricao if modelo else '' }}</textarea>

</div>

{% endblock %}
