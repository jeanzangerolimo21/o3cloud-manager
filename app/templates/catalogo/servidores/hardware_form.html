{% extends "layout/base.html" %}

{% block content %}
<div class="container-fluid">
    {% set page_title = "Item da Base de Hardware" %}
    {% set page_description = "Cadastro manual da tabela de hardware dos parceiros." %}
    {% set page_icon = "bi-cpu" %}
    {% include "components/page_header.html" %}

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="post">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Parceiro *</label>
                        <input class="form-control" name="parceiro" required maxlength="120" value="{{ item.parceiro if item else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Seção *</label>
                        <input class="form-control" name="secao" required maxlength="120" value="{{ item.secao if item else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Faixa de usuários *</label>
                        <input class="form-control" name="faixa_usuarios" required maxlength="80" value="{{ item.faixa_usuarios if item else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Memória</label>
                        <input class="form-control" name="memoria" maxlength="50" value="{{ item.memoria if item else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Processador</label>
                        <input class="form-control" name="processador" maxlength="50" value="{{ item.processador if item else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Disco</label>
                        <input class="form-control" name="disco" maxlength="50" value="{{ item.disco if item else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Ordem</label>
                        <input type="number" min="0" class="form-control" name="ordem" value="{{ item.ordem if item else 0 }}">
                    </div>
                </div>
                <div class="form-check mt-3">
                    <input class="form-check-input" type="checkbox" name="ativo" value="1" {% if not item or item.ativo %}checked{% endif %}>
                    <label class="form-check-label">Ativo</label>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button class="btn btn-primary" type="submit"><i class="bi bi-check-circle"></i> Salvar</button>
                    <a class="btn btn-outline-secondary" href="{{ url_for('catalogo.listar_servidores') }}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
