<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verificacao em duas etapas - O3Cloud Manager</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-body">
    <main class="login-shell">
        <section class="login-panel shadow-lg">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="O3Cloud" class="login-logo">
                <h1>Verificacao em duas etapas</h1>
                {% if metodo == "TOTP" %}
                <p class="text-muted mb-0">Informe o codigo do seu aplicativo autenticador</p>
                {% else %}
                <p class="text-muted mb-0">Informe o codigo enviado para {{ email }}</p>
                {% endif %}
            </div>
            {% include "components/alert.html" %}
            <form method="POST" autocomplete="off">
                <div class="mb-3">
                    <label class="form-label">Codigo de seguranca</label>
                    <input class="form-control form-control-lg text-center" name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autofocus required>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" name="lembrar_dispositivo" value="1" id="lembrar_dispositivo" checked>
                    <label class="form-check-label" for="lembrar_dispositivo">Confiar neste dispositivo por 30 dias</label>
                </div>
                <button class="btn btn-primary btn-lg w-100" type="submit">
                    <i class="bi bi-shield-check"></i> Verificar
                </button>
            </form>
            {% if metodo != "TOTP" %}
            <form method="POST" action="{{ url_for('autenticacao.reenviar_2fa') }}" class="mt-3 text-center">
                <button class="btn btn-link" type="submit">Reenviar codigo</button>
            </form>
            {% endif %}
        </section>
    </main>
</body>
</html>
