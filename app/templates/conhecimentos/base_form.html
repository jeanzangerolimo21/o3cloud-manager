{% extends "layout/base.html" %}{% block content %}<div class="container-fluid"><h2 class="mb-4">{{ 'Editar Base' if base and base.id else 'Nova Base de Conhecimento' }}</h2><div class="card shadow-sm border-0"><div class="card-body"><form method="post"><label class="form-label">Nome da base</label><input class="form-control mb-3" name="nome" maxlength="160" required value="{{ base.nome if base else '' }}"><label class="form-label">Ambiente do cliente</label><select class="form-select mb-3" name="ambiente_id"><option value="">Sem ambiente vinculado</option>{% for ambiente in ambientes %}<option value="{{ ambiente.id }}" {% if base and base.ambiente_id|string == ambiente.id|string %}selected{% endif %}>{{ ambiente.cliente_nome }} - {{ ambiente.nome }}{% if ambiente.prefixo_proxmox %} ({{ ambiente.prefixo_proxmox }}){% endif %}</option>{% endfor %}</select><div class="form-text mb-3">Opcional. Use quando esta base documentar um ambiente especifico do cliente.</div><label class="form-label">Descrição</label><textarea class="form-control" name="descricao" maxlength="500" rows="3">{{ base.descricao if base else '' }}</textarea><div class="mt-4"><button class="btn btn-primary"><i class="bi bi-check-circle"></i> Salvar</button> <a class="btn btn-outline-secondary" href="{{ url_for('conhecimentos.index') }}">Cancelar</a></div></form></div></div></div>{% endblock %}
