{% extends "layout/base.html" %}

{% block content %}

<div class="card">

    <div class="card-header d-flex justify-content-between align-items-center">

        <div>

            <h3>

                {% if modo == "editar" %}
                    Editar Contrato
                {% else %}
                    Novo Contrato
                {% endif %}

            </h3>

            <small class="text-muted">

                Cadastro Manual de Contrato

            </small>

        </div>

        <a href="{{ url_for('contratos.index') }}"
           class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Voltar

        </a>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">Cliente</label>

                    <select
                        class="form-select"
                        name="cliente_id"
                        required>

                        <option value="">Selecione...</option>

                        {% for cliente in clientes %}

                            <option value="{{ cliente.id }}">

                                {{ cliente.nome_fantasia }}

                            </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">

                        Número

                    </label>

                    <input
                        class="form-control"
                        name="numero"
                        required>

                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    <select
                        class="form-select"
                        name="status">

                        <option value="EM_ELABORACAO" selected>

                            Em Elaboração

                        </option>

                        <option value="ATIVO">

                            Ativo

                        </option>

                        <option value="EM_IMPLANTACAO">

                            Em Implantação

                        </option>

                        <option value="SUSPENSO">

                            Suspenso

                        </option>

                        <option value="CANCELADO">

                            Cancelado

                        </option>

                        <option value="ENCERRADO">

                            Encerrado

                        </option>

                    </select>

                </div>

            </div>

            <div class="row">

                <div class="col-md-3 mb-3">

                    <label class="form-label">

                        Valor Mensal

                    </label>

                    <input
                        class="form-control"
                        type="number"
                        step="0.01"
                        name="valor_mensal">

                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">

                        Dia Faturamento

                    </label>

                    <input
                        class="form-control"
                        type="number"
                        min="1"
                        max="31"
                        name="dia_faturamento"
                        value="15">

                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">

                        Início Vigência

                    </label>

                    <input
                        class="form-control"
                        type="date"
                        name="inicio_vigencia">

                </div>

                <div class="col-md-3 mb-3">

                    <label class="form-label">

                        Fim Vigência

                    </label>

                    <input
                        class="form-control"
                        type="date"
                        name="fim_vigencia">

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Descrição

                </label>

                <input
                    class="form-control"
                    name="descricao">

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Observações

                </label>

                <textarea
                    class="form-control"
                    rows="4"
                    name="observacoes"></textarea>

            </div>

            <button
                class="btn btn-primary">

                <i class="bi bi-check-circle"></i>

                Salvar

            </button>

            <a
                href="{{ url_for('contratos.index') }}"
                class="btn btn-secondary">

                Cancelar

            </a>

        </form>

    </div>

</div>

{% endblock %}
