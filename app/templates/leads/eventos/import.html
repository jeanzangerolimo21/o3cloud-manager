{% extends "layout/base.html" %}
{% block content %}<div class="container-fluid"><div class="mb-4"><h1>Importar Participantes</h1><p class="text-muted">{{ evento.nome_evento }}</p></div><div class="alert alert-info"><i class="bi bi-info-circle"></i> O arquivo será analisado antes de gravar. Você poderá revisar o mapeamento e os erros.</div><div class="card shadow-sm border-0"><div class="card-body"><form method="post" enctype="multipart/form-data"><label class="form-label">Planilha CSV, XLS ou XLSX</label><input class="form-control" type="file" name="arquivo" accept=".csv,.xls,.xlsx" required><div class="mt-4"><button class="btn btn-primary"><i class="bi bi-search"></i> Analisar arquivo</button> <a class="btn btn-outline-secondary" href="{{ url_for('eventos.visualizar',evento_id=evento.id) }}">Cancelar</a></div></form></div></div></div>{% endblock %}
