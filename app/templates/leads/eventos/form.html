{% extends "layout/base.html" %}
{% block content %}<div class="container-fluid"><div class="mb-4"><h1>{{ 'Editar Evento' if modo == 'editar' else 'Novo Evento' }}</h1></div><div class="card shadow-sm border-0"><div class="card-body"><form method="post"><div class="row g-3"><div class="col-md-8"><label class="form-label">Nome do Evento</label><input class="form-control" name="nome_evento" value="{{ evento.nome_evento if evento else '' }}" required maxlength="180"></div><div class="col-md-4"><label class="form-label">Data do Evento</label><input class="form-control" type="date" name="data_evento" value="{{ evento.data_evento.strftime('%Y-%m-%d') if evento and evento.data_evento else '' }}" required></div></div><div class="mt-4"><button class="btn btn-primary"><i class="bi bi-check-circle"></i> {{ 'Salvar alterações' if modo == 'editar' else 'Criar Evento' }}</button> <a class="btn btn-outline-secondary" href="{{ url_for('eventos.visualizar',evento_id=evento.id) if evento else url_for('eventos.index') }}">Cancelar</a></div></form></div></div></div>{% endblock %}
