{% extends "layout/base.html" %}{% block content %}<div class="container-fluid"><div class="mb-4"><h2>Editar Participante</h2><p class="text-muted">{{ evento.nome_evento }}</p></div><div class="card shadow-sm border-0"><div class="card-body"><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nome</label><input class="form-control" name="nome" required maxlength="150" value="{{ participante.nome or '' }}"></div><div class="col-md-6"><label class="form-label">Empresa</label><input class="form-control" name="empresa" maxlength="150" value="{{ participante.empresa or '' }}"></div><div class="col-md-4"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" value="{{ participante.email or '' }}"></div><div class="col-md-4"><label class="form-label">Telefone</label><input class="form-control" name="telefone" value="{{ participante.telefone or '' }}"></div><div class="col-md-4"><label class="form-label">CNPJ</label><input class="form-control" name="cnpj" value="{{ participante.cnpj or '' }}"></div></div><div class="mt-4"><button class="btn btn-primary"><i class="bi bi-check-circle"></i> Salvar alterações</button> <a class="btn btn-outline-secondary" href="{{ url_for('eventos.visualizar',evento_id=evento.id) }}">Cancelar</a></div></form></div></div></div>{% endblock %}
