<script>
document.querySelectorAll("[data-picker]").forEach(function (picker) {
    const inputName = picker.dataset.inputName;
    const maxItems = parseInt(picker.dataset.pickerMax || "0", 10);
    const createUrl = picker.dataset.pickerCreateUrl || "";
    const select = picker.querySelector(".js-picker-select");
    const search = picker.querySelector(".js-picker-search");
    const results = picker.querySelector(".js-picker-results");
    const list = picker.querySelector(".js-picker-list");
    if (!inputName || !select || !search || !results || !list) { return; }
    const options = Array.from(select.options).filter(function (option) {
        return option.value;
    }).map(function (option) {
        const label = option.dataset.label || option.textContent.trim();
        return {
            value: option.value,
            label: label,
            search: normalizeText([label, option.dataset.search || "", option.textContent || ""].join(" "))
        };
    });
    let activeIndex = 0;

    function normalizeText(value) {
        return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function hiddenInputs() {
        return Array.from(picker.querySelectorAll("input[type=\"hidden\"][name=\"" + inputName + "\"]"));
    }

    function selectedValues() {
        return hiddenInputs().map(function (input) { return input.value; });
    }

    function matchedOptions() {
        const terms = normalizeText(search.value).split(/\s+/).filter(Boolean);
        return options.filter(function (option) {
            return !selectedValues().includes(option.value) && terms.every(function (term) {
                return option.search.includes(term);
            });
        }).slice(0, 8);
    }

    function hideResults() {
        results.classList.add("d-none");
        results.innerHTML = "";
    }

    function chooseOption(option) {
        addOption(option);
    }

    function renderResults() {
        const matches = matchedOptions();
        activeIndex = 0;
        results.innerHTML = "";
        if (!matches.length || (maxItems > 0 && selectedValues().length >= maxItems)) {
            hideResults();
            select.value = "";
            return;
        }
        matches.forEach(function (option, index) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "list-group-item list-group-item-action text-start" + (index === activeIndex ? " active" : "");
            button.textContent = option.label;
            button.addEventListener("mousedown", function (event) {
                event.preventDefault();
                chooseOption(option);
            });
            results.appendChild(button);
        });
        select.value = matches[activeIndex].value;
        results.classList.remove("d-none");
    }

    function updateActive(nextIndex) {
        const buttons = Array.from(results.querySelectorAll("button"));
        if (!buttons.length) { return; }
        activeIndex = (nextIndex + buttons.length) % buttons.length;
        buttons.forEach(function (button, index) {
            button.classList.toggle("active", index === activeIndex);
        });
        const option = matchedOptions()[activeIndex];
        select.value = option ? option.value : "";
    }

    function renderItem(input) {
        const label = input.dataset.label || input.value;
        const item = document.createElement("div");
        item.className = "list-group-item d-flex justify-content-between align-items-center gap-3";
        item.dataset.value = input.value;
        item.innerHTML = "<span class=\"text-break\"></span><button class=\"btn btn-sm btn-outline-danger\" type=\"button\" title=\"Remover\"><i class=\"bi bi-x-lg\"></i></button>";
        item.querySelector("span").textContent = label;
        item.querySelector("button").addEventListener("click", function () {
            input.remove();
            item.remove();
            renderResults();
        });
        list.appendChild(item);
    }

    function clearSelected() {
        hiddenInputs().forEach(function (input) { input.remove(); });
        list.innerHTML = "";
    }

    function addOption(option) {
        if (!option || selectedValues().includes(option.value)) {
            search.value = "";
            select.value = "";
            hideResults();
            return;
        }
        if (maxItems === 1) {
            clearSelected();
        } else if (maxItems > 0 && selectedValues().length >= maxItems) {
            search.value = "";
            select.value = "";
            hideResults();
            return;
        }
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = inputName;
        input.value = option.value;
        input.dataset.label = option.label;
        picker.appendChild(input);
        renderItem(input);
        search.value = "";
        select.value = "";
        hideResults();
        search.focus();
    }

    function addSelected() {
        let option = options.find(function (item) { return item.value === select.value; });
        if (!option) { option = matchedOptions()[0]; }
        addOption(option);
    }

    hiddenInputs().forEach(renderItem);
    search.addEventListener("input", renderResults);
    search.addEventListener("focus", renderResults);
    search.addEventListener("keydown", function (event) {
        if (event.key === "ArrowDown") {
            event.preventDefault();
            updateActive(activeIndex + 1);
        } else if (event.key === "ArrowUp") {
            event.preventDefault();
            updateActive(activeIndex - 1);
        } else if (event.key === "Enter") {
            event.preventDefault();
            if (!results.classList.contains("d-none")) {
                const option = matchedOptions()[activeIndex];
                if (option) { chooseOption(option); return; }
            }
            addSelected();
        }
    });
    picker.querySelector(".js-picker-add").addEventListener("click", function () {
        if (createUrl) {
            window.location.href = createUrl;
            return;
        }
        addSelected();
    });
    document.addEventListener("click", function (event) {
        if (!picker.contains(event.target)) { hideResults(); }
    });
});
</script>
