<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="mb-1">

            <i class="bi {{ page_icon }}"></i>

            {{ page_title }}

        </h2>

        {% if page_description %}

        <p class="text-muted mb-0">

            {{ page_description }}

        </p>

        {% endif %}

    </div>

    {% if page_button_url %}

    <a
        href="{{ page_button_url }}"
        class="btn btn-primary">

        <i class="bi {{ page_button_icon }}"></i>

        {{ page_button_text }}

    </a>

    {% endif %}

</div>
