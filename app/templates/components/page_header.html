<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="mb-1">

            <i class="bi {{ page_icon }}"></i>

            {{ page_title }}

        </h2>

        {% if page_description %}

        <p class="text-muted mb-0">

            {{ page_description }}

        </p>

        {% endif %}

    </div>

    {% if page_button_url or page_secondary_button_url %}

    <div class="d-flex gap-2 flex-wrap justify-content-end">
        {% if page_secondary_button_url %}
        <a href="{{ page_secondary_button_url }}" class="btn btn-outline-primary">

            <i class="bi {{ page_secondary_button_icon }}"></i>

            {{ page_secondary_button_text }}

        </a>
        {% endif %}

        {% if page_button_url %}
        <a
            href="{{ page_button_url }}"
            class="btn btn-primary"
            {% if page_button_text == "Voltar" %}data-smart-back="1"{% endif %}>

            <i class="bi {{ page_button_icon }}"></i>

            {{ page_button_text }}

        </a>
        {% endif %}
    </div>

    {% endif %}

</div>
