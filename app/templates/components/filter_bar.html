<form method="GET" class="mb-4">

    <div class="row g-3 align-items-end">

        <div class="col-md-5">

            <label class="form-label">Pesquisar</label>

            <input
                type="text"
                class="form-control"
                name="q"
                value="{{ pesquisa or '' }}"
                placeholder="{{ placeholder }}">

        </div>

        {% if show_status %}

        <div class="col-md-2">

            <label class="form-label">Situação</label>

                <select class="form-select" name="{{ status_field }}">

                <option value="">Todos</option>

                {% for valor, descricao in status_options.items() %}

		<option value="{{ valor }}">
                        {% if selected_status == valor %}selected{% endif %} 

                        {{ descricao }}

                    </option>

                {% endfor %}

            </select>

        </div>

        {% endif %}

        {% if show_origem %}

        <div class="col-md-2">

            <label class="form-label">Origem</label>

            <select class="form-select" name="origem">

                <option value="">Todas</option>

                <option value="OMIE"
                    {% if origem=="OMIE" %}selected{% endif %}>

                    OMIE

                </option>

                <option value="MANUAL"
                    {% if origem=="MANUAL" %}selected{% endif %}>

                    Manual

                </option>

            </select>

        </div>

        {% endif %}

        <div class="col-md-1">

            <button class="btn btn-primary w-100">

                <i class="bi bi-search"></i>

            </button>

        </div>

        <div class="col-md-2">

            <a href="{{ request.path }}"
               class="btn btn-outline-secondary w-100">

                Limpar

            </a>

        </div>

    </div>

</form>
