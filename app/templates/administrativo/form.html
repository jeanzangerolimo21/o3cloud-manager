{% extends "layout/base.html" %}
{% block content %}
<div class="container-fluid"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2>{{ 'Nova Demanda' if modo == 'novo' else 'Editar Demanda' }}</h2><p class="text-muted mb-0">Registre a atividade e atribua o responsável.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('administrativo.index') }}"><i class="bi bi-arrow-left"></i> Voltar</a></div>
<form method="post" enctype="multipart/form-data"><div class="card border-0 shadow-sm"><div class="card-body"><div class="row g-3"><div class="col-md-8"><label class="form-label">Título</label><input required maxlength="180" class="form-control" name="titulo" value="{{ demanda.titulo or '' }}"></div><div class="col-md-4"><label class="form-label">Categoria</label><select class="form-select" name="categoria">{% for item in categorias %}<option value="{{ item }}" {% if (demanda.categoria or 'OUTROS') == item %}selected{% endif %}>{{ item|replace('_',' ')|title }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Descrição</label><textarea class="form-control" name="descricao" rows="3">{{ demanda.descricao or '' }}</textarea></div><div class="col-md-3"><label class="form-label">Prioridade</label><select class="form-select" name="prioridade">{% for item in prioridades %}<option value="{{ item }}" {% if (demanda.prioridade or 'NORMAL') == item %}selected{% endif %}>{{ item|title }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Status</label><select class="form-select" name="status">{% for item in status_options %}<option value="{{ item }}" {% if (demanda.status or 'PENDENTE') == item %}selected{% endif %}>{{ item|replace('_',' ')|title }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Responsável</label><select class="form-select" name="responsavel_id"><option value="">Não atribuído</option>{% for usuario in usuarios %}<option value="{{ usuario.id }}" {% if demanda.responsavel_id|string == usuario.id|string %}selected{% endif %}>{{ usuario.nome }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Departamento</label><select class="form-select" name="departamento_id"><option value="">Não definido</option>{% for item in departamentos %}<option value="{{ item.id }}" {% if demanda.departamento_id|string == item.id|string %}selected{% endif %}>{{ item.nome }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Data inicial</label><input type="date" class="form-control" name="data_inicial" value="{{ demanda.data_inicial or '' }}"></div><div class="col-md-3" id="data-limite-container"><label class="form-label">Data limite</label><input id="data-limite" type="date" class="form-control" name="data_limite" value="{{ demanda.data_limite or '' }}"></div><div class="col-md-3"><label class="form-label">Hora</label><input type="time" class="form-control" name="hora" value="{{ demanda.hora or '' }}"></div><div class="col-md-3"><label class="form-label">Anexos</label><input type="file" class="form-control" name="anexos" multiple></div>{% if pode_editar('administrativo') %}<div class="col-12 border rounded p-3"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="recorrente" value="1" id="recorrente" {% if demanda.recorrente %}checked{% endif %} onchange="atualizarCamposRecorrencia()"><label class="form-check-label" for="recorrente">Demanda recorrente</label></div><div id="recorrencia-config" class="row g-2 mt-2 {% if not demanda.recorrente %}d-none{% endif %}"><div class="col-md-3"><label class="form-label">Repetição</label><select class="form-select" name="recorrencia_tipo" id="recorrencia_tipo"><option value="DIARIA" {% if demanda.recorrencia_tipo == "DIARIA" %}selected{% endif %}>Todo dia</option><option value="SEMANAL" {% if demanda.recorrencia_tipo == "SEMANAL" %}selected{% endif %}>Toda semana</option><option value="MENSAL" {% if demanda.recorrencia_tipo == "MENSAL" %}selected{% endif %}>Todo mês</option><option value="ANUAL" {% if demanda.recorrencia_tipo == "ANUAL" %}selected{% endif %}>Todo ano</option></select></div><div class="col-md-3" id="recorrencia-semana"><label class="form-label">Dia da semana</label><select class="form-select" name="recorrencia_dia_semana"><option value="0" {% if demanda.recorrencia_dia_semana|string == "0" %}selected{% endif %}>Segunda-feira</option><option value="1" {% if demanda.recorrencia_dia_semana|string == "1" %}selected{% endif %}>Terça-feira</option><option value="2" {% if demanda.recorrencia_dia_semana|string == "2" %}selected{% endif %}>Quarta-feira</option><option value="3" {% if demanda.recorrencia_dia_semana|string == "3" %}selected{% endif %}>Quinta-feira</option><option value="4" {% if demanda.recorrencia_dia_semana|string == "4" %}selected{% endif %}>Sexta-feira</option><option value="5" {% if demanda.recorrencia_dia_semana|string == "5" %}selected{% endif %}>Sábado</option><option value="6" {% if demanda.recorrencia_dia_semana|string == "6" %}selected{% endif %}>Domingo</option></select></div><div class="col-md-2" id="recorrencia-dia"><label class="form-label">Dia do mês</label><input class="form-control" type="number" min="1" max="31" name="recorrencia_dia_mes" value="{{ demanda.recorrencia_dia_mes or '' }}"></div><div class="col-md-2" id="recorrencia-mes"><label class="form-label">Mês</label><select class="form-select" name="recorrencia_mes"><option value="1">Janeiro</option><option value="2">Fevereiro</option><option value="3">Março</option><option value="4">Abril</option><option value="5">Maio</option><option value="6">Junho</option><option value="7" {% if demanda.recorrencia_mes|string == "7" %}selected{% endif %}>Julho</option><option value="8">Agosto</option><option value="9">Setembro</option><option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option></select></div><div class="col-md-2"><label class="form-label">Repetir até (opcional)</label><input class="form-control" type="date" name="recorrencia_data_fim" value="{{ demanda.recorrencia_data_fim or '' }}"></div></div></div>{% endif %}<div class="col-12"><label class="form-label">Observações</label><textarea class="form-control" name="observacoes" rows="2">{{ demanda.observacoes or '' }}</textarea></div><div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="permitir_comentarios" value="1" {% if demanda.permitir_comentarios|default(true) %}checked{% endif %}><label class="form-check-label">Permitir comentários</label></div></div></div></div><div class="card-footer bg-white d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{{ url_for('administrativo.index') }}">Cancelar</a><button class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button></div></div></form></div>
<script>
(function () {
  const tipo = document.getElementById("recorrencia_tipo");
  const recorrente = document.getElementById("recorrente");
  const configuracao = document.getElementById("recorrencia-config");
  const dataLimiteContainer = document.getElementById("data-limite-container");
  const dataLimite = document.getElementById("data-limite");
  window.atualizarCamposRecorrencia = function () {
    const ativa = Boolean(recorrente && recorrente.checked);
    if (configuracao) configuracao.classList.toggle("d-none", !ativa);
    if (dataLimiteContainer) dataLimiteContainer.classList.toggle("d-none", ativa);
    if (dataLimite) dataLimite.disabled = ativa;
    atualizar();
  };
  if (!tipo) return;
  const semana = document.getElementById("recorrencia-semana");
  const dia = document.getElementById("recorrencia-dia");
  const mes = document.getElementById("recorrencia-mes");
  function atualizar() {
    semana.classList.toggle("d-none", tipo.value !== "SEMANAL");
    dia.classList.toggle("d-none", !["MENSAL", "ANUAL"].includes(tipo.value));
    mes.classList.toggle("d-none", tipo.value !== "ANUAL");
  }
  tipo.addEventListener("change", atualizar);
  atualizarCamposRecorrencia();
}());
</script>
{% endblock %}
