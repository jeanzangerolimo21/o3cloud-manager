{% extends "layout/base.html" %}
{% block content %}
<div class="container-fluid"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2>{{ 'Nova Demanda' if modo == 'novo' else 'Editar Demanda' }}</h2><p class="text-muted mb-0">Registre a atividade e atribua o responsável.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('administrativo.index') }}"><i class="bi bi-arrow-left"></i> Voltar</a></div>
<form method="post" enctype="multipart/form-data"><div class="card border-0 shadow-sm"><div class="card-body"><div class="row g-3"><div class="col-md-8"><label class="form-label">Título</label><input required maxlength="180" class="form-control" name="titulo" value="{{ demanda.titulo or '' }}"></div><div class="col-md-4"><label class="form-label">Categoria</label><select class="form-select" name="categoria">{% for item in categorias %}<option value="{{ item }}" {% if (demanda.categoria or 'OUTROS') == item %}selected{% endif %}>{{ item|replace('_',' ')|title }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Descrição</label><textarea class="form-control" name="descricao" rows="3">{{ demanda.descricao or '' }}</textarea></div><div class="col-md-3"><label class="form-label">Prioridade</label><select class="form-select" name="prioridade">{% for item in prioridades %}<option value="{{ item }}" {% if (demanda.prioridade or 'NORMAL') == item %}selected{% endif %}>{{ item|title }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Status</label><select class="form-select" name="status">{% for item in status_options %}<option value="{{ item }}" {% if (demanda.status or 'PENDENTE') == item %}selected{% endif %}>{{ item|replace('_',' ')|title }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Responsável</label><select class="form-select" name="responsavel_id"><option value="">Não atribuído</option>{% for usuario in usuarios %}<option value="{{ usuario.id }}" {% if demanda.responsavel_id|string == usuario.id|string %}selected{% endif %}>{{ usuario.nome }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Departamento</label><select class="form-select" name="departamento_id"><option value="">Não definido</option>{% for item in departamentos %}<option value="{{ item.id }}" {% if demanda.departamento_id|string == item.id|string %}selected{% endif %}>{{ item.nome }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Data inicial</label><input type="date" class="form-control" name="data_inicial" value="{{ demanda.data_inicial or '' }}"></div><div class="col-md-3"><label class="form-label">Data limite</label><input type="date" class="form-control" name="data_limite" value="{{ demanda.data_limite or '' }}"></div><div class="col-md-3"><label class="form-label">Hora</label><input type="time" class="form-control" name="hora" value="{{ demanda.hora or '' }}"></div><div class="col-md-3"><label class="form-label">Anexos</label><input type="file" class="form-control" name="anexos" multiple></div><div class="col-12"><label class="form-label">Observações</label><textarea class="form-control" name="observacoes" rows="2">{{ demanda.observacoes or '' }}</textarea></div><div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="permitir_comentarios" value="1" {% if demanda.permitir_comentarios|default(true) %}checked{% endif %}><label class="form-check-label">Permitir comentários</label></div></div></div></div><div class="card-footer bg-white d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{{ url_for('administrativo.index') }}">Cancelar</a><button class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button></div></div></form></div>
{% endblock %}
